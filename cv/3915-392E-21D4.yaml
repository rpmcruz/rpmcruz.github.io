  Ricardo P. M. Cruz is an Assistant Professor at the Faculty of Engineering of the University of Porto
  and a researcher at INESC TEC. He works on fundamental machine learning (ordinal classification,
  class imbalance, interpretability and robustness), with applications in medical imaging and autonomous
  driving. He holds a Ph.D. in Computer Science (2021) from the Universities of Porto, Aveiro and Minho,
  and an M.Sc. in Mathematical Engineering (2015) and a B.Sc. in Computer Science (2012) from the
  University of Porto.

